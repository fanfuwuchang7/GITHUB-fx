# 每日自动更新 ETF 报告（GitHub Actions 云端定时）
# 时间：北京时间周一至周五 15:40（UTC 07:40，收盘后数据已定型）
# 流程：抓取 -> 生成 docs/index.html -> 真源库回写 -> 提交推送
# 注意：Actions 的 runner 每次都是全新环境，累积历史全靠 etf_store.sqlite
#       提交回仓库，所以「真源库回写」这步不能省。
name: daily-update

on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发

permissions:
  contents: write              # 允许 workflow 向仓库推送提交

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run analysis (fetch + render)
        run: python etf_analysis.py --days 60 --save-snapshot

      - name: Send mail
        # 授权码必须在仓库 Secrets 里配 MAIL_PASS（代码里不含明文）。
        # 其余项有内置默认值；未配置的 Secret 会渲染为空串，脚本自动回退。
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_mail.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs etf_store.sqlite
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
